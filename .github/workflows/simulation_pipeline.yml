name: Biyofiziksel Simulasyon ve Optimizasyon Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-simulations:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4

    - name: Python Ortamini Kur
      uses: actions/setup-python@v5
      with:
        python-python: '3.10'
        cache: 'pip'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Gerekli temel kütüphanelerin kurulu olduğundan emin olalım
        pip install numpy scipy matplotlib

    - name: Test Süitini Koştur (Pytest)
      run: |
        pytest

    - name: DDE Bifurkasyon Simülasyonunu Tetikle
      run: |
        python3 simulations/delay_coupled_bifurcation.py

    - name: 8890 Senaryoluk Olasılık Motorunu Optimize Et
      run: |
        python3 utils/probability_engine.py

    - name: Üretilen Grafik ve Raporları Çıktı Olarak Sakla (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: simulasyon-ve-olasilik-ciktilari
        path: |
          figures/*.png
          bridge_models/*.json
        retention-days: 7
