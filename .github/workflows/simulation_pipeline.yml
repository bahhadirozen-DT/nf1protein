name: Biyofiziksel Simulasyon ve Optimizasyon Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-simulations:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4

    - name: Python Ortamini Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy matplotlib pytest

    - name: Test Süitini Koştur (Pytest)
      run: |
        python3 -m pytest

    - name: DDE Bifurkasyon Simülasyonunu Tetikle
      run: |
        python3 simulations/delay_coupled_bifurcation.py

    - name: 8890 Senaryoluk Olasılık Motorunu Optimize Et
      run: |
        python3 utils/probability_engine.py

    - name: Canlı Bağlantı Noktası ve Görsel Özet Paneli Oluştur (Job Summary)
      run: |
        echo "## 📊 Biyofiziksel Simülasyon Pipeline Özet Raporu" >> $GITHUB_STEP_SUMMARY
        echo "Simülasyon başarıyla tamamlandı ve grafikler üretildi! Aşağıdaki bağlantı noktalarından sonuçlara erişebilirsiniz:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔍 İstatistiksel Olasılık Uzayı Sonuçları (8890 Senaryo)" >> $GITHUB_STEP_SUMMARY
        
        if [ -f bridge_models/probability_space.json ]; then
          MEAN_OCC=$(cat bridge_models/probability_space.json | grep "optimized_mean_occupancy" | awk -F: '{print $2}' | tr -d ' ,')
          SUCCESS_RATE=$(cat bridge_models/probability_space.json | grep "target_suppression_success_rate_percent" | awk -F: '{print $2}' | tr -d ' ,')
          ITERATIONS=$(cat bridge_models/probability_space.json | grep "optimization_iterations" | awk -F: '{print $2}' | tr -d ' ,')
          
          echo "| Parametre | Değer |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Hedef Bastırma Başarı Oranı** | %$SUCCESS_RATE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Optimize Edilmiş Ortalama Doluluk ($\mu$)** | $MEAN_OCC |" >> $GITHUB_STEP_SUMMARY
          echo "| **Gereken Optimizasyon İterasyonu** | $ITERATIONS |" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ `probability_space.json` verisi bulunamadı." >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Üretilen Grafik Bağlantıları" >> $GITHUB_STEP_SUMMARY
        echo "Grafikleri ve ham veri matrislerini indirmek için iş akışının üst kısmındaki **Artifacts (Görsel Çıktılar)** alanını kullanabilir veya reponuzun ana dizinini kontrol edebilirsiniz." >> $GITHUB_STEP_SUMMARY

    - name: Üretilen Grafik ve Raporları Çıktı Olarak Sakla (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: simulasyon-ve-olasilik-ciktilari
        path: |
          figures/*.png
          bridge_models/*.json
        retention-days: 7
